<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#17120e"/>

  <!-- Outer amber ring -->
  <circle cx="128" cy="104" r="52" fill="none" stroke="#c47a3a" stroke-width="4" opacity="0.3"/>

  <!-- Camera aperture blades -->
  <g transform="translate(128,104)">
    <ellipse rx="18" ry="38" fill="#c47a3a" opacity="0.18" transform="rotate(0)"/>
    <ellipse rx="18" ry="38" fill="#c47a3a" opacity="0.18" transform="rotate(60)"/>
    <ellipse rx="18" ry="38" fill="#c47a3a" opacity="0.18" transform="rotate(120)"/>
  </g>

  <!-- Center lens circle -->
  <circle cx="128" cy="104" r="26" fill="#c47a3a" opacity="0.12"/>
  <circle cx="128" cy="104" r="18" fill="#c47a3a" opacity="0.25"/>
  <circle cx="128" cy="104" r="10" fill="#c47a3a"/>

  <!-- Lens shine -->
  <circle cx="133" cy="99" r="3.5" fill="white" opacity="0.35"/>

  <!-- Wordmark: CRAFTIFYLE -->
  <text
    x="128"
    y="180"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="bold"
    fill="#ede5d8"
    text-anchor="middle"
    letter-spacing="4"
  >CRAFTIFYLE</text>

  <!-- Tagline -->
  <text
    x="128"
    y="202"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    fill="#c47a3a"
    text-anchor="middle"
    letter-spacing="3"
    font-weight="600"
  >PHOTOGRAPHY · PHOTOBOOTH</text>

  <!-- Bottom accent line -->
  <line x1="64" y1="214" x2="192" y2="214" stroke="#c47a3a" stroke-width="1" opacity="0.4"/>
</svg>
